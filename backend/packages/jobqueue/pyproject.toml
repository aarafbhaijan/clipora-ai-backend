[project]
name = "clipora-jobqueue"
version = "0.1.0"
description = "Postgres jobs-table queue: enqueue, claim, lease, retry"
requires-python = ">=3.12,<3.14"
dependencies = [
  "clipora-core",
  "clipora-db",
  "sqlalchemy>=2.1,<2.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jobqueue"
