[project]
name = "clipora-rag"
version = "0.1.0"
description = "Transcript chunking, embeddings, hybrid retrieval, memory helpers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "clipora-core",
  "clipora-db",
  "sentence-transformers>=6.2,<7",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag"
