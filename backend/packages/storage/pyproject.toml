[project]
name = "clipora-storage"
version = "0.1.0"
description = "S3 key builders, presign and multipart helpers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "clipora-core",
  "boto3>=1.43,<2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "storage"
