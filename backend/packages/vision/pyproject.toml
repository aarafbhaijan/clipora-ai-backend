[project]
name = "clipora-vision"
version = "0.1.0"
description = "YOLO person detection and tracking"
requires-python = ">=3.12,<3.14"
dependencies = [
  "clipora-core",
  "clipora-media",
  "ultralytics>=8.4,<9",
  "lap>=0.5.12,<0.6",
  "numpy>=2.5,<3",
  "mediapipe>=1.1,<2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vision"
