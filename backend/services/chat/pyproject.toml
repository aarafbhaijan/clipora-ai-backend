[project]
name = "clipora-chat"
version = "0.1.0"
description = "Streaming chat service: routes each message (edit vs question vs chat) and streams answers over SSE"
requires-python = ">=3.12,<3.14"
dependencies = [
  "clipora-api",
  "clipora-agent",
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54,<0.55",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chat"
